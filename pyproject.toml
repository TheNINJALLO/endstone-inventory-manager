[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-inventory-manager"
version = "1.0.16"
description = "An Endstone plugin for managing player inventories with database-powered offline player support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TheN1NJ4LL0" }
]
dependencies = [
    "endstone>=0.11.11,<0.12",
    "endstone-inventoryui @ https://github.com/TheNINJALLO/endstone-inventoryui/archive/refs/tags/v2.0.7.zip",
    "bedrock-protocol-packets-ng>=0.0.9"
]

[project.entry-points."endstone"]
inventory-manager = "endstone_inventory_manager.inventory_manager:InventoryManagerPlugin"